# FORMAL · Admin API – Cloudflare Worker
# פריסה: bash deploy-admin.sh  (מתוך התיקייה הזו)
name = "formal-admin"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

[vars]
GH_OWNER = "Chana-C"
GH_REPO = "formal"
GH_BRANCH = "main"
# מאיזה אתרים מותר לממשק הניהול לפנות ל-API (מופרד בפסיקים). localhost תמיד מותר.
ALLOWED_ORIGINS = "https://formal-action.pages.dev,https://chana-c.github.io"
# חתימת הקומיטים שנוצרים מהממשק (השם שלך, לא של כלי)
COMMIT_NAME = "Chana-C"
COMMIT_EMAIL = "142223141+Chana-C@users.noreply.github.com"
MAX_UPLOAD_MB = "20"
# כתובת דף הניהול – משמשת לקישורי איפוס סיסמה שנשלחים במייל
ADMIN_URL = "https://formal-action.pages.dev/admin.html"
# הכתובת הראשית של האתר (Cloudflare Pages) – מוצגת בממשק הניהול
SITE_URL = "https://formal-action.pages.dev/"

[[kv_namespaces]]
binding = "ADMIN_KV"
id = "40fdbbe39fde4b34ac8a499a643ef911"

# Secrets (לא בקובץ הזה! מוגדרים עם wrangler secret put):
#   GITHUB_TOKEN     – טוקן גיטהאב עם הרשאת כתיבה לריפו formal
#   SESSION_SECRET   – מחרוזת אקראית ארוכה לחתימת ההתחברויות
#   OWNER_EMAIL      – המייל של בעלת האתר (המנהלת הראשית)
#   OWNER_PASSWORD   – הסיסמה הראשונית של בעלת האתר (אפשר לשנות מהממשק)
