<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הדף לא נמצא · FORMAL</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@300;500&display=swap" rel="stylesheet">
  <!-- דף זה מוגש על ידי GitHub Pages מכל כתובת שגויה, לכן הוא עצמאי (בלי קבצים חיצוניים יחסיים) -->
  <style>
    :root { --bg: #0a0a0a; --fg: #f2f2f2; --red: #e10600; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; font-family: "Heebo", "Segoe UI", Arial, sans-serif; font-weight: 300; line-height: 1.6;
      background: radial-gradient(ellipse 60% 50% at 50% 110%, rgba(225, 6, 0, 0.35), transparent 65%), var(--bg); }
    .eyebrow { display: inline-flex; align-items: center; gap: 12px; font-family: "Courier New", monospace; font-size: 0.72rem; letter-spacing: 0.22em; color: var(--red); margin-bottom: 18px; }
    .eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--red); }
    .num { font-family: "Frank Ruhl Libre", "Times New Roman", serif; font-weight: 900; font-size: clamp(6rem, 25vw, 18rem); line-height: 0.9; color: var(--red); text-shadow: 0 0 60px rgba(225, 6, 0, 0.45); }
    h1 { font-family: "Frank Ruhl Libre", serif; font-weight: 700; font-size: clamp(1.6rem, 4vw, 2.6rem); margin: 10px 0 0; }
    p { color: rgba(242, 242, 242, 0.62); font-size: 1.1rem; margin: 16px auto 32px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 999px; background: var(--red); color: #fff; font-weight: 500; text-decoration: none; transition: background 0.3s, transform 0.3s; }
    .btn:hover { background: #fff; color: #0a0a0a; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div>
    <p class="eyebrow">CUT!</p>
    <div class="num">404</div>
    <h1>הסצנה הזו לא צולמה</h1>
    <p>הדף שחיפשתם לא קיים או שהועבר.</p>
    <a class="btn" id="home" href="/">חזרה לדף הבית</a>
  </div>
  <script>
    // ב-GitHub Pages האתר יושב תחת /formal/ – מחשבים את הנתיב לדף הבית לפי הכתובת
    (function () {
      var seg = location.pathname.split("/")[1] || "";
      var home = /github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
      document.getElementById("home").href = home;
    })();
  </script>
</body>
</html>
